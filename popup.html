<!DOCTYPE html>  
<html lang="es">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Ventana Emergente Divertida</title>  
    <style>  
        body {  
            margin: 0;  
            overflow: hidden;  
            background-color: transparent; /* Fondo transparente para mostrar la imagen */  
            display: flex;  
            justify-content: center;  
            align-items: center;  
            height: 100vh;  
        }  

        #popup {  
            width: 200px; /* Cambia esto por el ancho de la imagen */  
            height: 200px; /* Cambia esto por la altura de la imagen */  
            background-image: url('photos/Trollface.png'); /* Imagen Trollface */  
            background-size: contain; /* Asegura que la imagen se ajuste correctamente */  
            background-position: center; /* Centra la imagen */  
            border-radius: 15px; /* Bordes redondeados */  
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5); /* Sombra */  
        }  
    </style>  
</head>  
<body>  
    <div id="popup"></div> <!-- Contenedor para la ventana emergente -->  

    <script>  
        // Posiciones y velocidades iniciales  
        let x = Math.random() * (screen.width - 200); // Ajusta la posición horizontal inicial  
        let y = Math.random() * (screen.height - 200); // Ajusta la posición vertical inicial  
        let velocidadX = (Math.random() > 0.5 ? 3 : -3); // Velocidad horizontal  
        let velocidadY = (Math.random() > 0.5 ? 3 : -3); // Velocidad vertical  

        // Función para mover la ventana emergente  
        function moverVentana() {  
            // Actualiza la posición  
            x += velocidadX; // Movimiento horizontal  
            y += velocidadY; // Movimiento vertical  

            // Cambia la dirección al llegar a los bordes de la pantalla  
            if (x + 200 > screen.width || x < 0) {  
                velocidadX *= -1; // Rebote horizontal  
            }  
            if (y + 200 > screen.height || y < 0) {  
                velocidadY *= -1; // Rebote vertical  
            }  

            // Mueve la ventana a la nueva posición  
            window.moveTo(x, y);  

            requestAnimationFrame(moverVentana); // Continúa el movimiento de manera suave  
        }  

        moverVentana(); // Iniciar el movimiento  
    </script>  
</body>  
</html>
