<!DOCTYPE html>  
<html lang="es">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Ventanas Emergentes Divertidas</title>  
    <style>  
        body {  
            margin: 0;  
            overflow: hidden;  
            background-color: transparent; /* Fondo transparente para mostrar la imagen */  
        }  
        .popup {  
            width: 50px; /* Tamaño reducido */  
            height: 50px; /* Tamaño reducido */  
            background-image: url('photos/Trollface.png'); /* Imagen Trollface */  
            background-size: contain; /* Asegura que la imagen se ajuste correctamente */  
            background-position: center; /* Centra la imagen */  
            border-radius: 15px; /* Bordes redondeados */  
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5); /* Sombra */  
            position: absolute; /* Permite que se posicione libremente en la pantalla */  
            cursor: pointer; /* Cambia el cursor al pasar sobre la ventana */  
        }  
    </style>  
</head>  
<body>  
    <script>  
        const numInitialPopups = 5; // Número inicial de ventanas emergentes  

        // Función para crear una nueva ventana emergente  
        function crearPopup() {  
            const popup = window.open("", "_blank", "width=100,height=100");  
            // Escribir contenido de la ventana emergente  
            popup.document.write(`  
                <html>  
                <head>  
                    <title>Popup</title>  
                    <style>  
                        body {  
                            margin: 0;  
                            display: flex;  
                            justify-content: center;  
                            align-items: center;  
                            height: 100vh;  
                            background-color: transparent; /* Fondo transparente */  
                        }  
                        img {  
                            width: 50px; /* Tamaño de la imagen */  
                            height: 50px; /* Tamaño de la imagen */  
                        }  
                    </style>  
                </head>  
                <body>  
                    <img src="photos/Trollface.png" alt="Trollface" />  
                </body>  
                </html>  
            `);  

            // Manejar el evento de cierre de la ventana  
            popup.onbeforeunload = function() {  
                // Crear dos nuevas ventanas cuando se cierre  
                crearPopup();  
                crearPopup();  
            };  
        }  

        // Crear las ventanas emergentes iniciales  
        for (let i = 0; i < numInitialPopups; i++) {  
            crearPopup();  
        }  
    </script>  
</body>  
</html>
